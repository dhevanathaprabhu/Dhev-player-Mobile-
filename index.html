<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="./node_modules/jsmediatags/dist/jsmediatags.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>

    </style>
</head>

<body>

    <div class="app-container">
        <!-- Top App Bar / Header -->
        <header class="app-header">
            <div class="header-top">
                <div class="brand">
                    <h2>Dhev Player</h2>
                </div>
                <div class="select-wrapper">

                    <button type="button" class="composer-select">
                        <span class="selected-composer">All Composers</span>
                        <span class="dropdown-arrow">▼</span>
                    </button>
                
                    <ul class="custom-options"></ul>
                
                </div>
                <button class="add-btn-header" onclick="document.getElementById('mp3').click()" title="Add Music">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- Search Bar -->
            <div class="search-cont">
                <div class="search">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" class="findsong" placeholder="Search songs, artists...">
                </div>
            </div>
        </header>

        <!-- File Input -->
        <input type="file" id="mp3" accept=".mp3" multiple hidden>

        <!-- Main Scrollable Area -->
        <main class="main">
            <div class="section-title">
                <span>Your Library</span>
                <span id="song-count" class="count-badge"></span>
            </div>

            <!-- Song List -->
            <div class="song-list">
                <!-- Populated dynamically -->
            </div>
        </main>

        <!-- Floating Action Button for Adding Music -->
        <!-- <div class="addmusic" id="add-fab" title="Add Songs">
            <i class="add fa-solid fa-plus"></i>
        </div> -->

        <!-- Sticky Bottom Mini Player -->
        <nav class="player">
            <div class="progress-container">
                <div class="progress-stamp">
                    <span id="stamp-left">0:00</span>
                </div>


                <input type="range" id="progress-bar" value="0" min="0" max="100">
                <div class="progress-stamp">

                    <span id="stamp-right">0:00</span>

                </div>
            </div>

            <div class="player-content">
                <div class="player-left">
                    <div class="album-art-wrap">
                        <img src="" alt="" id="player-img">
                        <div id="player-img-placeholder" class="img-placeholder">
                            <i class="fa-solid fa-music"></i>
                        </div>
                    </div>
                    <div class="playernames">
                        <h4 id="player-name">Select a song</h4>
                        <p id="player-album">Music Player</p>
                    </div>
                </div>

                <div class="player-controls">
                    <i class="shuffle fa-solid fa-shuffle" title="Shuffle"></i>
                    <i class="previous fa-solid fa-backward-step" title="Previous"></i>
                    <i class="player-play fa-solid fa-circle-play" title="Play/Pause"></i>
                    <i class="next fa-solid fa-forward-step" title="Next"></i>
                    <i class="repeat fa-solid fa-repeat" title="Repeat"></i>
                </div>
            </div>


        </nav>
    </div>



</body>
<script src="./script.js?v=2"></script>
</html>
